<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Google tag (gtag.js) -->

    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectando ao especialista | AutoVans</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root {
            --whatsapp: #25D366;
            --whatsapp-dark: #128c5e;
            --primary: #1a1a2e;
            --bg: #fafaf7;
            --text: #1f2937;
            --muted: #6b7280;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
        }
        .bg-blob.whatsapp { background: var(--whatsapp); width: 480px; height: 480px; top: -120px; left: -120px; }
        .bg-blob.primary  { background: var(--primary);  width: 520px; height: 520px; bottom: -160px; right: -160px; }
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            background: #ffffff;
            border-radius: 24px;
            padding: 3rem 2.5rem;
            box-shadow: 0 24px 60px -20px rgba(26, 26, 46, 0.18), 0 8px 20px -8px rgba(26, 26, 46, 0.08);
            text-align: center;
        }
        .icon-wrapper {
            width: 96px;
            height: 96px;
            margin: 0 auto 1.5rem;
            background: #e8f8ee;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .icon-wrapper::after {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 1px solid rgba(37, 211, 102, 0.25);
            animation: pulse 2s ease-out infinite;
        }
        @keyframes pulse {
            0%   { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.25); opacity: 0; }
        }
        .icon-wrapper svg {
            width: 48px;
            height: 48px;
            color: var(--whatsapp);
        }
        h1 {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
            line-height: 1.3;
        }
        p.lead {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }
        .progress {
            width: 100%;
            height: 6px;
            background: #f1f1ef;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 1.25rem;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--whatsapp), var(--whatsapp-dark));
            border-radius: 999px;
            transition: width 0.1s linear;
        }
        .countdown {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            margin-bottom: 2rem;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(26, 26, 46, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .manual-link {
            display: inline-block;
            color: var(--primary);
            text-decoration: underline;
            text-underline-offset: 3px;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .manual-link:hover { color: var(--whatsapp-dark); }
        .footer-note {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #b8b8b8;
        }
        @media (max-width: 480px) {
            .card { padding: 2.25rem 1.5rem; border-radius: 20px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="bg-blob whatsapp"></div>
    <div class="bg-blob primary"></div>

    <main class="card" role="status" aria-live="polite">
        <div class="icon-wrapper" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
        </div>

        <h1>Conectando ao especialista...</h1>
        <p class="lead">Seus dados foram recebidos. Você será redirecionado para o WhatsApp em <span id="countNumber">3</span> segundos.</p>

        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="countdown">
            <span class="spinner" aria-hidden="true"></span>
            AGUARDE
        </div>

        <a href="#" class="manual-link" id="manualLink">Clique aqui se não for redirecionado automaticamente</a>

        <p class="footer-note">AutoVans • Transporte executivo desde 2000</p>
    </main>

    <script>
        // URL de destino do WhatsApp
        const DESTINATION_URL = 'https://wa.me/5531986850382';
        const SECONDS = 3;

        let remaining = SECONDS;
        const totalMs = SECONDS * 1000;
        const startTs = Date.now();

        const progressBar = document.getElementById('progressBar');
        const countNumber = document.getElementById('countNumber');
        const manualLink = document.getElementById('manualLink');

        manualLink.setAttribute('href', DESTINATION_URL);

        // Atualiza contador regressivo e barra de progresso
        const intervalId = setInterval(() => {
            const elapsed = Date.now() - startTs;
            const ratio = Math.min(elapsed / totalMs, 1);
            const secondsLeft = Math.max(0, Math.ceil((totalMs - elapsed) / 1000));

            progressBar.style.width = (ratio * 100).toFixed(1) + '%';
            progressBar.parentElement.setAttribute('aria-valuenow', Math.round(ratio * 100));
            if (secondsLeft !== remaining) {
                remaining = secondsLeft;
                countNumber.textContent = remaining;
            }
        }, 50);

        // Redireciona após 3 segundos
        const redirectTimeout = setTimeout(() => {
            clearInterval(intervalId);
            window.location.href = DESTINATION_URL;
        }, totalMs);

        // Acessibilidade: atalho "Enter" aciona o link manual
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                window.location.href = DESTINATION_URL;
            }
        });

        // Se o usuário navegar de volta, cancela timers
        window.addEventListener('beforeunload', () => {
            clearTimeout(redirectTimeout);
            clearInterval(intervalId);
        });
    </script>
</body>
</html>
